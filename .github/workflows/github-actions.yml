name: 'Deploy REST API'

on:
  workflow_dispatch:
    inputs:
      app_version:
        description: 'App Version ex:1.0.0'
        required: true
        default: 1.0.0
      skip_docker:
        description: 'Skip docker build'
        required: true
        default: 'false'
      terraform_destroy:
        description: 'Destroy infra'
        required: true
        default: 'false'


permissions:
  contents: read

jobs:
  docker:
    name: 'Build Docker'
    runs-on: ubuntu-latest
    environment: production
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      if: ${{ github.event.inputs.skip_docker  == 'false' }}
      uses: docker/setup-buildx-action@v3
    
    - name: Build Docker
      if: ${{ github.event.inputs.skip_docker  == 'false' }}
      uses: docker/build-push-action@v6
      with:
        push: false
        context: ./application
        file: ./application/Dockerfile
        platforms: linux/arm64
        tags: rest-api-flask:${{ github.event.inputs.app_version }}
        outputs: type=docker
    
    - name: Push to ECR
      if: ${{ github.event.inputs.skip_docker  == 'false' }}
      id: ecr
      uses: jwalton/gh-ecr-push@v2
      with:
        access-key-id:  ${{ secrets.AWS_ACCESS_KEY }}
        secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        region: us-east-1
        image: rest-api-flask:${{ github.event.inputs.app_version }}

  terraform:
    name: 'Terraform'
    runs-on: ubuntu-latest
    needs: docker
    environment: production

    # Use the Bash shell regardless whether the GitHub Actions runner is ubuntu-latest, macos-latest, or windows-latest
    defaults:
      run:
        shell: bash

    steps:
    # Checkout the repository to the GitHub Actions runner
    - name: Checkout  
      uses: actions/checkout@v4

    - name: Configure aws credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1
    
    # Install the latest version of Terraform CLI and configure the Terraform CLI configuration file with a Terraform Cloud user API token
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2.0.2
      
    # Initialize a new or existing Terraform working directory by creating initial files, loading any remote state, downloading modules, etc.
    - name: Terraform Init
      run: terraform init
      working-directory: ./infrastructure

    # Checks that all Terraform configuration files adhere to a canonical format
    - name: Terraform Format
      run: terraform fmt -check

    # Generates an execution plan for Terraform
    - name: Terraform Plan
      run: terraform plan -input=false
      working-directory: ./infrastructure
      env:
        MONGODB_ATLAS_PRIVATE_KEY: ${{ secrets.MONGODB_ATLAS_PRIVATE_KEY }}
        MONGODB_ATLAS_PUBLIC_KEY: ${{ secrets.MONGODB_ATLAS_PUBLIC_KEY }}

      # On push to "main", build or change infrastructure according to Terraform configuration files
      # Note: It is recommended to set up a required "strict" status check in your repository for "Terraform Cloud". See the documentation on "strict" required status checks for more information: https://help.github.com/en/github/administering-a-repository/types-of-required-status-checks
    - name: Terraform Apply
      if: ${{ github.event.inputs.terraform_destroy  == 'false' }}
      run: terraform apply -auto-approve -input=false
      working-directory: ./infrastructure
      env:
        MONGODB_ATLAS_PRIVATE_KEY: ${{ secrets.MONGODB_ATLAS_PRIVATE_KEY }}
        MONGODB_ATLAS_PUBLIC_KEY: ${{ secrets.MONGODB_ATLAS_PUBLIC_KEY }}

    - name: Terraform Destroy
      if: ${{ github.event.inputs.terraform_destroy  == 'true' }}
      run: terraform destroy -auto-approve -input=false
      working-directory: ./infrastructure
      env:
        MONGODB_ATLAS_PRIVATE_KEY: ${{ secrets.MONGODB_ATLAS_PRIVATE_KEY }}
        MONGODB_ATLAS_PUBLIC_KEY: ${{ secrets.MONGODB_ATLAS_PUBLIC_KEY }}
      
    
