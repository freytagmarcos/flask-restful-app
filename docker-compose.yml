# Use root/example as user/password credentials
version: '3.1'

services:

  mongodb_2:
    image: mongo:5.0
    ports:
      - 27017:27017
    restart: always
    container_name: mongodb_2
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin

  api_users:
    build:
      context: .
    ports: 
      - 5000:5000
    restart: always
    depends_on:
     - mongodb_2
    volumes:
      - .:/app